<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار التكامل - Integration Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            border-right: 4px solid #667eea;
        }
        .test-section h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-left: 5px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.success {
            background: #28a745;
            color: white;
        }
        .status.error {
            background: #dc3545;
            color: white;
        }
        .status.pending {
            background: #ffc107;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار التكامل - Integration Test</h1>
        
        <div class="test-section">
            <h2>1. اختبار Health Check</h2>
            <button onclick="testHealth()">اختبار</button>
            <div id="health-result"></div>
        </div>

        <div class="test-section">
            <h2>2. اختبار تسجيل الدخول</h2>
            <input type="text" id="username" placeholder="اسم المستخدم" value="admin@standard.com" style="padding: 8px; margin: 5px; width: 200px;">
            <input type="password" id="password" placeholder="كلمة المرور" value="123456" style="padding: 8px; margin: 5px; width: 200px;">
            <button onclick="testLogin()">اختبار تسجيل الدخول</button>
            <div id="login-result"></div>
        </div>

        <div class="test-section">
            <h2>3. اختبار جلب المنتجات</h2>
            <button onclick="testProducts()" id="products-btn" disabled>اختبار (يحتاج تسجيل دخول)</button>
            <div id="products-result"></div>
        </div>

        <div class="test-section">
            <h2>4. اختبار Dashboard Stats</h2>
            <button onclick="testDashboard()" id="dashboard-btn" disabled>اختبار (يحتاج تسجيل دخول)</button>
            <div id="dashboard-result"></div>
        </div>

        <div class="test-section">
            <h2>5. اختبار جميع Endpoints</h2>
            <button onclick="testAll()">اختبار الكل</button>
            <div id="all-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let accessToken = null;

        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            const className = isError ? 'error' : 'success';
            element.innerHTML = `<div class="result ${className}">${JSON.stringify(data, null, 2)}</div>`;
        }

        function showLoading(elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = '<div class="result info">جاري الاختبار...<span class="loading"></span></div>';
        }

        async function testHealth() {
            showLoading('health-result');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                showResult('health-result', { status: 'success', data });
            } catch (error) {
                showResult('health-result', { status: 'error', message: error.message }, true);
            }
        }

        async function testLogin() {
            showLoading('login-result');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    accessToken = data.access_token;
                    localStorage.setItem('access_token', accessToken);
                    document.getElementById('products-btn').disabled = false;
                    document.getElementById('dashboard-btn').disabled = false;
                    showResult('login-result', { status: 'success', message: 'تم تسجيل الدخول بنجاح', token: accessToken.substring(0, 20) + '...' });
                } else {
                    showResult('login-result', { status: 'error', data }, true);
                }
            } catch (error) {
                showResult('login-result', { status: 'error', message: error.message }, true);
            }
        }

        async function testProducts() {
            if (!accessToken) {
                accessToken = localStorage.getItem('access_token');
                if (!accessToken) {
                    showResult('products-result', { status: 'error', message: 'يجب تسجيل الدخول أولاً' }, true);
                    return;
                }
            }

            showLoading('products-result');
            try {
                const response = await fetch(`${API_BASE}/api/v1/products?page=1&page_size=5`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                showResult('products-result', { status: 'success', data });
            } catch (error) {
                showResult('products-result', { status: 'error', message: error.message }, true);
            }
        }

        async function testDashboard() {
            if (!accessToken) {
                accessToken = localStorage.getItem('access_token');
                if (!accessToken) {
                    showResult('dashboard-result', { status: 'error', message: 'يجب تسجيل الدخول أولاً' }, true);
                    return;
                }
            }

            showLoading('dashboard-result');
            try {
                const response = await fetch(`${API_BASE}/api/v1/dashboard/stats`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                showResult('dashboard-result', { status: 'success', data });
            } catch (error) {
                showResult('dashboard-result', { status: 'error', message: error.message }, true);
            }
        }

        async function testAll() {
            showLoading('all-result');
            const results = {};

            // 1. Health Check
            try {
                const health = await fetch(`${API_BASE}/health`);
                results.health = await health.json();
            } catch (e) {
                results.health = { error: e.message };
            }

            // 2. Login
            try {
                const login = await fetch(`${API_BASE}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin@standard.com', password: '123456' })
                });
                const loginData = await login.json();
                results.login = loginData;
                if (loginData.access_token) {
                    accessToken = loginData.access_token;
                }
            } catch (e) {
                results.login = { error: e.message };
            }

            // 3. Products (if logged in)
            if (accessToken) {
                try {
                    const products = await fetch(`${API_BASE}/api/v1/products?page=1&page_size=3`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    results.products = await products.json();
                } catch (e) {
                    results.products = { error: e.message };
                }
            }

            showResult('all-result', results);
        }

        // تحميل Token من localStorage عند التحميل
        window.onload = () => {
            accessToken = localStorage.getItem('access_token');
            if (accessToken) {
                document.getElementById('products-btn').disabled = false;
                document.getElementById('dashboard-btn').disabled = false;
            }
        };
    </script>
</body>
</html>
