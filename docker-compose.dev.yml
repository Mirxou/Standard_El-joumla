# Development Docker Compose
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # SQLite Database (for development)
  # No separate database container needed - uses local SQLite

  # REST API Service (Development)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: erp_api_dev
    environment:
      - DATABASE_URL=sqlite:///data/erp.db
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - erp_network

  # Redis (for caching in development)
  redis:
    image: redis:7-alpine
    container_name: erp_redis_dev
    ports:
      - "6379:6379"
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

