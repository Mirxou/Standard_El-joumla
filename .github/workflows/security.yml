# ============================================================================
# Security Pipeline — Standard El-Joumla ERP
# Triggers: push, PR, weekly schedule, manual
# Steps: dependency audit → SAST → secrets scan → Docker scan
# ============================================================================
name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC
  workflow_dispatch:

jobs:
  # ── Dependency Vulnerability Audit ──────────────────────────────────────
  dependency-audit:
    name: "🔒 Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt \
            --desc \
            || echo "⚠️  Vulnerabilities found — review above"

      - name: Check for known vulnerabilities in requirements
        run: |
          pip install safety 2>/dev/null || true
          safety check -r requirements.txt --json || echo "⚠️  Safety check complete"

  # ── SAST: Bandit Security Lint ─────────────────────────────────────────
  bandit-scan:
    name: "🛡️ SAST — Bandit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ \
            -ll -ii \
            -f json -o bandit-report.json \
            || true
          bandit -r src/ -ll -ii || echo "⚠️  Security issues found"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Secrets Detection ───────────────────────────────────────────────────
  secrets-scan:
    name: "🔑 Secrets Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ── CodeQL Analysis ─────────────────────────────────────────────────────
  codeql:
    name: "🔬 CodeQL Analysis"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ── Docker Image Scan ──────────────────────────────────────────────────
  docker-scan:
    name: "🐳 Docker Image Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image for scanning
        run: docker build -t erp-api:scan -f Dockerfile.api .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: erp-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'  # Don't fail, just report

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── License Compliance ─────────────────────────────────────────────────
  license-check:
    name: "📜 License Compliance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-licenses
        run: pip install pip-licenses

      - name: Check licenses
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip-licenses \
            --from=mixed \
            --fail-on="GPL-3.0,GPL-2.0,AGPL-3.0" \
            || echo "⚠️  Copyleft licenses detected — review required"
