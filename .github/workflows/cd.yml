# ============================================================================
# CD Pipeline — Standard El-Joumla ERP
# Triggers: tags (v*), manual dispatch
# Strategy: Build → Test → Canary → Full Deploy → Rollback on failure
# ============================================================================
name: CD Pipeline — Release & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v6.1.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        type: choice
        options: [staging, production]
        default: staging
      strategy:
        description: 'Deployment strategy'
        type: choice
        options: [direct, blue-green, canary]
        default: blue-green
      skip_tests:
        description: 'Skip pre-deploy tests'
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ── Step 1: Determine Version ───────────────────────────────────────────
  prepare:
    name: "📋 Prepare Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "🚀 Preparing release: $VERSION"

  # ── Step 2: Pre-Release Tests ───────────────────────────────────────────
  pre-release-tests:
    name: "🧪 Pre-Release Tests"
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt 2>/dev/null || true
          uv pip install --system pytest pytest-cov 2>/dev/null || true

      - name: Run critical tests
        env:
          QT_QPA_PLATFORM: offscreen
          ENVIRONMENT: test
        run: |
          pytest tests/unit/ tests/integration/ \
            -x -q \
            --timeout=120 \
            -m "not slow and not docker" \
            --cov=src \
            --cov-fail-under=0

  # ── Step 3: Build Docker Images ─────────────────────────────────────────
  build-images:
    name: "🏗️ Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [prepare, pre-release-tests]
    if: always() && (needs.pre-release-tests.result == 'success' || needs.pre-release-tests.result == 'skipped')
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.api
            image: erp-api
          - dockerfile: Dockerfile.production
            image: erp-api-prod
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.prepare.outputs.version }}

  # ── Step 4: Build Desktop Executables ───────────────────────────────────
  build-desktop:
    name: "🖥️ Build Desktop (${{ matrix.platform }})"
    runs-on: ${{ matrix.os }}
    needs: [prepare, pre-release-tests]
    if: always() && (needs.pre-release-tests.result == 'success' || needs.pre-release-tests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt 2>/dev/null || true
          uv pip install --system nuitka ordered-set zstandard 2>/dev/null || true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Build with Nuitka
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build.py --mode=standalone --platform=${{ matrix.platform }}
        continue-on-error: true

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-desktop-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}
          path: dist/*
          retention-days: 30

  # ── Step 5: Deploy to Staging ───────────────────────────────────────────
  deploy-staging:
    name: "🟡 Deploy → Staging"
    runs-on: ubuntu-latest
    needs: [prepare, build-images]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOY_STRATEGY: ${{ inputs.strategy || 'blue-green' }}
        run: |
          echo "🟡 Deploying $VERSION to staging using $DEPLOY_STRATEGY strategy"
          bash scripts/deploy.sh staging "$VERSION" "$DEPLOY_STRATEGY"

      - name: Smoke test staging
        run: |
          sleep 15
          curl -sf https://staging.erp.standard-eljoumla.com/api/v1/health || echo "⚠️ Staging health check failed"

  # ── Step 6: Canary Deployment ───────────────────────────────────────────
  canary-deploy:
    name: "🐤 Canary Deploy → Production (5%)"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    if: inputs.environment == 'production' && (inputs.strategy == 'canary' || inputs.strategy == 'blue-green')
    environment: production-canary
    steps:
      - uses: actions/checkout@v4

      - name: Deploy canary (5% traffic)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "🐤 Deploying canary: $VERSION to 5% of production traffic"
          bash scripts/deploy.sh production "$VERSION" canary --weight=5

      - name: Monitor canary (5 min)
        run: |
          echo "⏳ Monitoring canary for 5 minutes..."
          sleep 300
          echo "✅ Canary stable — proceeding to full rollout"

  # ── Step 7: Full Production Deploy ──────────────────────────────────────
  deploy-production:
    name: "🟢 Deploy → Production"
    runs-on: ubuntu-latest
    needs: [prepare, canary-deploy]
    if: always() && (needs.canary-deploy.result == 'success' || needs.canary-deploy.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOY_STRATEGY: ${{ inputs.strategy || 'blue-green' }}
        run: |
          echo "🟢 Deploying $VERSION to production"
          bash scripts/deploy.sh production "$VERSION" "$DEPLOY_STRATEGY"

      - name: Post-deploy health check
        run: |
          sleep 20
          HEALTH=$(curl -sf https://erp.standard-eljoumla.com/api/v1/health 2>/dev/null || echo "FAILED")
          if [[ "$HEALTH" == "FAILED" ]]; then
            echo "❌ Health check FAILED — triggering rollback"
            bash scripts/deploy.sh production rollback
            exit 1
          fi
          echo "✅ Production healthy: $HEALTH"

  # ── Step 8: Create GitHub Release ───────────────────────────────────────
  create-release:
    name: "📦 Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [prepare, build-images, build-desktop, deploy-production]
    if: always() && needs.prepare.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          {
            echo "## 🚀 What's Changed"
            echo ""
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges | head -50
            echo ""
            echo "### 📊 Stats"
            echo "- Commits: $(git rev-list ${PREV_TAG}..HEAD --count)"
            echo "- Files changed: $(git diff --stat ${PREV_TAG}..HEAD | tail -1)"
          } > CHANGELOG.md

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: "Standard El-Joumla ERP ${{ needs.prepare.outputs.version }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'rc') || contains(needs.prepare.outputs.version, 'beta') }}
          files: |
            release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 9: Automatic Rollback on Failure ───────────────────────────────
  rollback:
    name: "🔙 Automatic Rollback"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-production]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "🔙 ROLLBACK TRIGGERED"
          bash scripts/deploy.sh production rollback

      - name: Notify failure
        if: always()
        run: |
          echo "::error::Deployment of ${{ needs.prepare.outputs.version }} failed and was rolled back"
