[pytest]
# إعدادات pytest للاختبارات
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# خيارات الإخراج واستبعاد الملفات
addopts =
    -v
    --strict-markers
    --tb=short
    --capture=no
    -W always
    --ignore-glob=tests/integration/integration_test.py
    --ignore-glob=tests/legacy/*

# إعدادات asyncio
asyncio_mode = auto

# مسارات Python
pythonpath = src

# علامات الاختبار
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires database)
    ui: UI tests (requires Qt application)
    slow: Slow tests (may take more than 1 second)
    requires_db: Tests that require database connection
    requires_ui: Tests that require Qt application
    asyncio: Tests that use asyncio
    database_backend: Tests for database backend abstraction
    database_metrics: Tests for database metrics
    websocket: Tests for WebSocket functionality
    backend_integration: Tests for backend integration

# تصفية التحذيرات
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    default

