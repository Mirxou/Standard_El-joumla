[pytest]
# إعدادات pytest للاختبارات
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# خيارات الإخراج
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=60

# علامات الاختبار
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires database)
    ui: UI tests (requires Qt application)
    slow: Slow tests (may take more than 1 second)
    requires_db: Tests that require database connection
    requires_ui: Tests that require Qt application

# تصفية التحذيرات
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

