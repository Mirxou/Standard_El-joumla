global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@standard-eljoumla.com'
  smtp_auth_username: 'alerts@standard-eljoumla.com'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email-notifications'
  routes:
  - match:
      severity: critical
    receiver: 'critical-email'
  - match:
      severity: warning
    receiver: 'warning-email'

receivers:
- name: 'email-notifications'
  email_configs:
  - to: 'admin@standard-eljoumla.com'
    send_resolved: true

- name: 'critical-email'
  email_configs:
  - to: 'admin@standard-eljoumla.com,manager@standard-eljoumla.com'
    send_resolved: true
    headers:
      Subject: 'CRITICAL: {{ .GroupLabels.alertname }}'

- name: 'warning-email'
  email_configs:
  - to: 'admin@standard-eljoumla.com'
    send_resolved: true
    headers:
      Subject: 'WARNING: {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']