groups:
  - name: system_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% for instance {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% for instance {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% for {{ $labels.mountpoint }} on {{ $labels.instance }}"

  - name: application_alerts
    rules:
      - alert: ApplicationDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      - alert: DatabaseConnectionHigh
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connections"
          description: "Database has {{ $value }} active connections"

  - name: ai_alerts
    rules:
      - alert: AIModelAccuracyLow
        expr: ai_model_accuracy < 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI model accuracy is low"
          description: "Model {{ $labels.model_name }} accuracy is {{ $value }}"

      - alert: AIServiceDown
        expr: up{job="ai-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI service is down"
          description: "AI service has been unavailable for 2 minutes"

  - name: business_alerts
    rules:
      - alert: SalesDrop
        expr: rate(sales_revenue_total[1h]) < rate(sales_revenue_total[1h] offset 24h) * 0.5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Significant sales drop detected"
          description: "Sales revenue dropped by more than 50% compared to yesterday"

      - alert: InventoryLow
        expr: inventory_stock_level < inventory_reorder_point
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Low inventory alert"
          description: "Product {{ $labels.product_id }} is below reorder point"