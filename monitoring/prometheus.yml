global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API Metrics
  - job_name: 'erp_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Worker Metrics
  - job_name: 'erp_worker'
    static_configs:
      - targets: ['worker:8000']
    metrics_path: '/metrics'

  # PostgreSQL Exporter (if installed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  # Redis Exporter (if installed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

